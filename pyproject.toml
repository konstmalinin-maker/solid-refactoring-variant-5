[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_before", "tests_after"]
addopts = "--backend=refactored"
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["ALL"]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests_before", "tests_after"]
also_copy = ["tests_before", "tests_after", "conftest.py", "legacy", "main.py"]
max_stack_depth = -1
